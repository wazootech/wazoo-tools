name: Publish to JSR

on:
  push:
    branches: [main]

jobs:
  publish:
    if: github.repository == 'wazootech/wazoo-tools'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.x"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run ci
      # jsr (pinned in devDependencies) bundles its own Deno-based publisher and
      # downloads it on first use, so this runner needs no Deno install.
      - name: Publish dry run (smoke)
        run: bun run publish:dry
      # A push to main that does not bump jsr.json's version is routine (docs,
      # CI, refactors): skip the publish green with a notice instead of failing
      # main. A published version is a JSR fact, so ask JSR (meta.json lists
      # every published version) rather than trusting the tree.
      - name: Check if version is already published
        id: version
        run: |
          VERSION=$(jq -r .version jsr.json)
          if curl -sf https://jsr.io/@wazoo/tools/meta.json | jq -e ".versions[\"$VERSION\"]" > /dev/null; then
            echo "::notice::Version $VERSION of @wazoo/tools is already on JSR; nothing to publish. Bump the version in jsr.json to release."
            echo "already-published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already-published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to JSR
        if: steps.version.outputs.already-published == 'false'
        run: bunx jsr publish
