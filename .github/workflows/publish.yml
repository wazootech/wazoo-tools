name: Publish to JSR

on:
  push:
    branches: [main]

jobs:
  publish:
    if: github.repository == 'wazootech/wazoo-tools'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.8
      - run: deno install --frozen
      - name: Check if version is already published
        id: version
        run: |
          VERSION=$(jq -r .version deno.json)
          if curl -sf https://jsr.io/@wazoo/tools/meta.json | jq -e ".versions[\"$VERSION\"]" > /dev/null; then
            echo "::notice::Version $VERSION of @wazoo/tools is already on JSR; nothing to publish. Bump the version in deno.json to release."
            echo "already-published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already-published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to JSR (dry run)
        run: deno publish --dry-run
      - name: Publish to JSR
        if: steps.version.outputs.already-published == 'false'
        run: deno publish --quiet
