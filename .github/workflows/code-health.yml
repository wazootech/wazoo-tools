name: code-health
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: File length (enforced; 120 src / 300 test, blank/comment/import/re-export lines excluded)
        run: |
          # Allowlist of legitimate exceptions; may only shrink.
          allow=""
          loc() {
            awk '
              state { if ($0 ~ /}/) state = 0; next }
              /^[ \t]*($|\/\/|\/\*|\*)/ { next }
              /^[ \t]*(import|export)[ \t]/ && / from / { next }
              /^[ \t]*import[ \t]+["'"'"']/ { next }
              /^[ \t]*(import|export)[ \t]+(type[ \t]+)?{/ && $0 !~ /}/ { state = 1; next }
              { n++ }
              END { print n + 0 }
            ' "$1"
          }
          fail=0
          while read -r f; do
            case " $allow " in *" $f "*) continue;; esac
            n=$(loc "$f")
            case "$f" in *.test.*|*.spec.*|*/tests/*|tests/*) max=300;; *) max=120;; esac
            if [ "$n" -gt "$max" ]; then
              echo "::error file=$f::$n lines of code (limit $max)"
              echo "- \`$f\`: $n (limit $max)" >> "$GITHUB_STEP_SUMMARY"
              fail=1
            fi
          done < <(git ls-files '*.ts' '*.tsx' '*.js' '*.mjs' \
            | grep -vE '(^|/)(node_modules|dist|generated|fixtures|\.next)/|\.d\.ts$|\.gen\.|openapi|snapshot|schema')
          exit "$fail"
      - name: TODO/FIXME without an issue link (warn-only)
        run: |
          git grep -nE '\b(TODO|FIXME)\b' -- '*.ts' '*.tsx' '*.js' '*.mjs' ':!*generated*' \
            | grep -vE '#[0-9]+|/issues/[0-9]+' \
            | while IFS=: read -r f l _; do echo "::warning file=$f,line=$l::TODO/FIXME without an issue link"; done || true
